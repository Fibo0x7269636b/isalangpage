name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check documentation against isac.wasm
        run: npm run docs:check
      - name: Build with a project-site base path
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          ISALANG_COMPILER_REPO: ${{ vars.ISALANG_COMPILER_REPO }}
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}
